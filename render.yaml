# Render Blueprint — New > Blueprint 로 이 저장소를 고르면 아래 설정으로 서버가 만들어져요.
services:
  - type: web
    name: ashen-rift-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false   # 배포할 때 Neon에서 복사한 주소를 붙여 넣어요
      - key: ALLOWED_ORIGINS
        sync: false   # 선택: 넷리파이 주소 (예: https://ashen-rift.netlify.app)
